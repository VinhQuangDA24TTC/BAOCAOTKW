<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Chi tiết sản phẩm</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/lib.js"></script>
</head>
<body>
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="page.html" class="text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Chi tiết sản phẩm</li>
            </ol>
        </nav>

        <div class="row mt-4">
            <div class="col-md-6 text-center mb-3">
                <img id="p-image" src="" class="img-fluid rounded shadow-sm" alt="Sản phẩm" style="max-height: 400px; object-fit: cover;">
            </div>
            <div class="col-md-6">
                <h1 id="p-name" class="fw-bolder text-danger h2">Tên sản phẩm</h1>
                <h3 id="p-price" class="text-muted my-3">Đơn giá</h3>
                <hr>
                <h4 class="h5 fw-bold">Mô tả sản phẩm:</h4>
                <p id="p-description" class="text-justify" style="text-align: justify; line-height: 1.6;">Nội dung mô tả</p>
            </div>
        </div>
    </div>

    <script>
        // Thực hiện bóc tách URL và đổ dữ liệu sau khi DOM đã sẵn sàng
        document.addEventListener("DOMContentLoaded", function() {
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const productId = urlParams.get('id');

            // Tìm sản phẩm tương ứng ép kiểu về Number
            const product = productlist.find(item => item.id === Number(productId));

            if (product) {
                document.getElementById("p-image").src = product.image;
                document.getElementById("p-image").alt = product.name;
                document.getElementById("p-name").innerHTML = product.name;
                document.getElementById("p-price").innerHTML = product.price;
                document.getElementById("p-description").innerHTML = product.desc;
                document.title = product.name; // Đổi tiêu đề trang theo tên sản phẩm
            } else {
                document.body.innerHTML = `<div class="container mt-5 alert alert-danger text-center"><h3>Không tìm thấy sản phẩm hoặc ID không hợp lệ!</h3><a href="page.html" class="btn btn-primary mt-3">Quay lại danh sách</a></div>`;
            }
        });
    </script>
</body>
</html>
