<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Chi tiết sản phẩm - Panasonic Lumix</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/lib.js"></script>
    <link rel="stylesheet" href="../css/style7.css">
    
    <style>
        /* Toàn bộ giao diện Dark Mode theo chuẩn Panasonic */
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        
        /* Tùy biến thanh điều hướng Breadcrumb kiểu tối giản */
        .breadcrumb {
            background: transparent;
            padding: 0;
            margin: 0;
        }
        .breadcrumb-item a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .breadcrumb-item a:hover {
            color: #ffffff;
        }
        .breadcrumb-item.active {
            color: #ffffff;
            font-weight: bold;
        }
        .breadcrumb-item + .breadcrumb-item::before {
            color: #666666;
        }

        /* Khung hiển thị ảnh sản phẩm */
        .image-box {
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            padding: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        #p-image {
            max-height: 380px;
            object-fit: contain;
            width: 100%;
        }

        /* Khối thông tin bên phải */
        .lumix-accent-bar {
            width: 4px;
            background-color: #007bff; /* Màu xanh đặc trưng trên trang chủ Lumix của bạn */
            display: inline-block;
            height: 24px;
            float: left;
            margin-right: 12px;
        }
        #p-name {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: -4px;
        }
        #p-price {
            font-size: 1.6rem;
            color: #ffffff;
            font-weight: bold;
            margin-top: 15px;
        }

        /* Đoạn văn mô tả */
        .desc-heading {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888888;
            font-weight: bold;
        }
        #p-description {
            color: #cccccc;
            line-height: 1.7;
            font-size: 0.95rem;
            text-align: justify;
        }

        /* Nút bấm dẹt, góc vuông cứng cáp chuẩn hãng công nghệ */
        .btn-lumix-cart {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            font-weight: bold;
            border-radius: 0px;
            padding: 10px 24px;
            transition: all 0.2s ease;
        }
        .btn-lumix-cart:hover {
            background-color: #007bff;
            border-color: #007bff;
            color: #ffffff;
        }
        .btn-lumix-back {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 0px;
            padding: 10px 24px;
            transition: all 0.2s ease;
        }
        .btn-lumix-back:hover {
            background-color: #222222;
            border-color: #ffffff;
            color: #ffffff;
        }
    </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-black border-bottom border-secondary border-opacity-25 mb-4">
      <div class="container">
          <a class="navbar-brand fw-bold text-uppercase tracking-wider fs-5" href="page6.html">
              PANASONIC LUMIX
          </a>
      </div>
  </nav>

  <div class="container my-5">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="page6.html">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Chi tiết sản phẩm</li>
        </ol>
    </nav>

    <div class="row g-5 align-items-center">
        <div class="col-md-6">
            <div class="image-box">
                <img id="p-image" src="" class="img-fluid" alt="Sản phẩm">
            </div>
        </div>
        
        <div class="col-md-6">
            <div>
                <div class="d-flex align-items-start mb-2">
                    <span class="lumix-accent-bar"></span>
                    <h1 id="p-name" class="text-white m-0">Tên sản phẩm</h1>
                </div>
                
                <h3 id="p-price">Đơn giá</h3>
                
                <hr class="border-secondary opacity-50 my-4">
                
                <h4 class="desc-heading mb-2">Mô tả sản phẩm</h4>
                <p id="p-description">Nội dung mô tả</p>
            </div>
            
            <div class="mt-4 d-flex gap-3">
                <button id="add-to-cart-btn" class="btn btn-lumix-cart px-4">
                    Thêm vào giỏ hàng
                </button>
                <a href="page6.html" class="btn btn-lumix-back px-4">
                    Quay lại
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Trích xuất ID từ thanh địa chỉ URL
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    // 2. Tìm kiếm đối tượng dữ liệu tương ứng trong lib.js
    const product = productlist.find(item => item.id === Number(productId));

    if (product) {
        // Đổ dữ liệu nguyên bản từ mảng vào giao diện
        document.getElementById("p-image").src = product.image;
        document.getElementById("p-name").innerHTML = product.name;
        document.getElementById("p-price").innerHTML = product.price;
        document.getElementById("p-description").innerHTML = product.desc;
        
        // Gắn sự kiện kích hoạt hàm addToCart có sẵn của hệ thống
        document.getElementById("add-to-cart-btn").onclick = function () {
            if (typeof addToCart === "function") {
                addToCart(product.id);
                alert(`Đã thêm "${product.name}" vào giỏ hàng thành công!`);
            }
        };
    } else {
        console.log("Không tìm thấy sản phẩm hợp lệ!");
    }
</script>
</body>
</html>
