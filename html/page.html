<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Danh sách sản phẩm Lumix</title>
    <meta charset="utf-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/lib.js"></script>
</head>

<body>
    <div class="modal fade" id="orderModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Thông tin khách hàng
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="order-form">

                    <div class="mb-3">
                        <label>Họ tên</label>

                        <input type="text"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Tuổi</label>

                        <input type="number"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Ngày tháng năm sinh</label>

                        <input type="date"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Số CCCD</label>

                        <input type="text"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Địa chỉ</label>

                        <input type="text"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>

                        <input type="email"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-success w-100">
                        Xác nhận đặt hàng
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="page.html">PANASONIC LUMIX</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="page.html">Trang chủ</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Máy ảnh
                        </a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="page.html?cat=camera">Tất cả máy ảnh</a></li>
                            <li><a class="dropdown-item" href="page.html?cat=camera&sys=fullframe">Fullframe</a></li>
                            <li><a class="dropdown-item" href="page.html?cat=camera&sys=m43">M43</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Ống kính
                        </a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="page.html?cat=lens">Tất cả ống kính</a></li>
                            <li><a class="dropdown-item" href="page.html?cat=lens&sys=fullframe">Fullframe</a></li>
                            <li><a class="dropdown-item" href="page.html?cat=lens&sys=m43">M43</a></li>
                        </ul>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <h2 id="main-title" class="mb-4">
            Danh sách sản phẩm Lumix
        </h2>

        <div class="row">

            <div class="col-lg-8">
                <div class="row row-cols-1 row-cols-md-3 g-3" id="product-list">

                </div>
            </div>

            <div class="col-lg-4">

    <div class="border p-3">

        <h4>Giỏ hàng</h4>

        <div id="cart-items-container">

        </div>

        <hr>

        <h5 id="cart-total-price">
            0 VNĐ
        </h5>

        <button class="btn btn-primary w-100 mt-2"
                data-bs-toggle="modal"
                data-bs-target="#orderModal">
            Đặt hàng
        </button>

        <button class="btn btn-danger w-100 mt-2"
                onclick="clearCart()">
            Xóa giỏ hàng
        </button>

    </div>

</div>

        </div>

    </div>

    <script>

        const urlParams = new URLSearchParams(window.location.search);

        const cat = urlParams.get("cat");
        const sys = urlParams.get("sys");

        let list = productlist;

        if(cat){
            list = list.filter(item => item.cat == cat);
        }

        if(sys){
            list = list.filter(item => item.system == sys);
        }

        if(list.length > 0){

            list.forEach(function(item){

                addproduct(
                    item.id,
                    item.name,
                    item.price,
                    item.image,
                    item.productLink
                );

            });

        }

        renderCart();

        function renderCart(){

            let cart = JSON.parse(localStorage.getItem("lumix_cart")) || [];

            let container = document.getElementById("cart-items-container");

            let total = 0;

            container.innerHTML = "";

            if(cart.length == 0){

                container.innerHTML = "<p>Chưa có sản phẩm</p>";

                document.getElementById("cart-total-price").innerHTML = "0 VNĐ";

                return;
            }

            cart.forEach(function(item,index){

                let div = document.createElement("div");

                div.className = "mb-3 border-bottom pb-2";

                div.innerHTML = `
                    <p class="mb-1">${item.name}</p>
                    <p class="text-danger">${item.price}</p>
                    <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">
                        Xóa
                    </button>
                `;

                container.appendChild(div);

                total += parseInt(item.price.replace(/[^0-9]/g,""));

            });

            document.getElementById("cart-total-price").innerHTML =
                total.toLocaleString("vi-VN") + " VNĐ";
        }

        function removeItem(index){

            let cart = JSON.parse(localStorage.getItem("lumix_cart")) || [];

            cart.splice(index,1);

            localStorage.setItem("lumix_cart",JSON.stringify(cart));

            renderCart();
        }

        function clearCart(){

            localStorage.removeItem("lumix_cart");

            renderCart();
        }
        document.getElementById("order-form").addEventListener("submit", function(e){

    e.preventDefault();

    alert("Đặt hàng thành công!");

    localStorage.removeItem("lumix_cart");

    renderCart();

    const modal =
        bootstrap.Modal.getInstance(
            document.getElementById("orderModal")
        );

    modal.hide();

    document.getElementById("order-form").reset();

});

    </script>

</body>
</html>
